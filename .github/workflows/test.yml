name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hook-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare the PowerShell hook with its POSIX port
        shell: pwsh
        run: ./tests/Test-HookParity.ps1
